# Cloudflare Worker — NH 투자증권 Open API 중계 서버 (조회 전용, 주문 API 없음)
# `npm run worker:setup` 이 이 파일을 proxy/wrangler.toml 로 복사하고 아래 값을 채웁니다 (wrangler.toml 은 git 제외).
# 비밀값(NH_APP_KEY, NH_APP_SECRET, PROXY_TOKEN, 선택: NH_ACCOUNTS)은 여기에 쓰지 않고 `npx wrangler secret put` 으로만 넣습니다.
name = "stock-dashboard-proxy"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

[vars]
# 대시보드 주소 (내 GitHub Pages) — 이 출처에서 온 요청만 받음
ALLOWED_ORIGINS = "https://YOUR_GITHUB_ID.github.io,http://localhost:5173"

# 접근토큰 · 배당 장부 · 공유 종목 목록 저장용 KV
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_ID"
