<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자산 대시보드</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>자산 대시보드</h1>
          <p class="sub" id="asof"></p>
        </div>
        <div class="topbar-right">
          <div class="sync">
            <button type="button" class="btn primary" id="sync-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="sync-menu">
              <span aria-hidden="true">⟳</span> 마이데이터 동기화 <span class="caret-down" aria-hidden="true">▾</span>
            </button>
            <div class="menu" id="sync-menu" role="menu" hidden>
              <button type="button" role="menuitem" id="menu-excel">
                <span>① 엑셀 불러오기</span>
                <small>Summary · 입금내역 · 보유종목 · 그룹 (브라우저 안에서만 읽음)</small>
              </button>
              <button type="button" role="menuitem" id="menu-sync">
                <span>② 최신 정보 가져오기</span>
                <small id="sync-state">NH 계좌 잔고 · 모든 종목 현재가</small>
              </button>
              <button type="button" role="menuitem" id="menu-export">
                <span>③ 엑셀 업데이트</span>
                <small id="export-state">보유종목 · 그룹 · 자산스냅샷 시트에 지금 값 저장</small>
              </button>
              <button type="button" role="menuitem" id="menu-settings">
                <span>동기화 설정</span>
                <small>중계 서버 주소 · 접속 토큰</small>
              </button>
              <button type="button" role="menuitem" id="menu-clear" class="danger">
                <span>불러온 데이터 지우기</span>
                <small>이 브라우저에 저장된 값 삭제</small>
              </button>
            </div>
            <input type="file" id="excel-input" accept=".xlsx" hidden />
          </div>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="화면 테마 전환">◐</button>
        </div>
      </header>
      <p class="notice" id="source-note" hidden></p>

      <nav class="filters" aria-label="계좌 선택">
        <div class="seg" id="account-seg" role="group"></div>
      </nav>

      <section class="kpis" id="kpis" aria-label="요약"></section>

      <section class="card" aria-labelledby="trend-title">
        <div class="card-head">
          <div>
            <h2 id="trend-title">자산 추이</h2>
            <p class="hint">원금 위로 칠해진 부분이 수익금입니다 (빨강 = 수익, 파랑 = 손실)</p>
          </div>
          <div class="seg small" id="return-mode" role="group" aria-label="수익률 기준">
            <button type="button" data-mode="simple">단순 수익률</button>
            <button type="button" data-mode="twr">시간가중(TWR)</button>
          </div>
        </div>

        <div class="range-row">
          <div class="seg small" id="preset-seg" role="group" aria-label="기간"></div>
          <div class="date-range">
            <input type="date" id="a-start" aria-label="기간 시작일" />
            <span>~</span>
            <input type="date" id="a-end" aria-label="기간 종료일" />
          </div>
          <label class="check"><input type="checkbox" id="compare-toggle" /> 다른 기간과 비교</label>
        </div>

        <div class="range-row compare-row" id="compare-row" hidden>
          <span class="tag tag-b">비교 기간</span>
          <div class="seg small" role="group" aria-label="비교 기간 제안">
            <button type="button" id="b-prev">직전 기간</button>
            <button type="button" id="b-lastyear">전년 동기</button>
          </div>
          <div class="date-range">
            <input type="date" id="b-start" aria-label="비교 기간 시작일" />
            <span>~</span>
            <input type="date" id="b-end" aria-label="비교 기간 종료일" />
          </div>
        </div>

        <div class="legend" id="trend-legend"></div>
        <div class="chart-stack">
          <div class="chart-box tall"><canvas id="value-chart" aria-label="평가금과 원금 추이"></canvas></div>
          <div class="chart-box short"><canvas id="return-chart" aria-label="수익률 추이"></canvas></div>
        </div>

        <div id="period-stats"></div>

        <div id="compare-panel" hidden>
          <h3>기간별 누적 수익률 (시간가중, 시작일 = 0%)</h3>
          <div class="legend" id="compare-legend"></div>
          <div class="chart-box mid"><canvas id="compare-chart" aria-label="기간 비교 수익률"></canvas></div>
        </div>
      </section>

      <section class="card" aria-labelledby="year-title">
        <div class="card-head">
          <div>
            <h2 id="year-title">연도별 수익률 (연초 대비)</h2>
            <p class="hint">연초대비 = 자산 ÷ (연초 자산 + 올해 순입금) − 1 · 입출금 효과를 뺀 그해 수익률</p>
          </div>
        </div>
        <div class="year-grid">
          <div class="table-wrap"><table id="year-table" class="data"></table></div>
          <div>
            <div class="legend" id="ytd-legend"></div>
            <div class="chart-box mid"><canvas id="ytd-chart" aria-label="연도별 연초 대비 수익률 추이"></canvas></div>
            <p class="hint" id="ytd-note"></p>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="dep-title" id="deposit-card" hidden>
        <div class="card-head">
          <div>
            <h2 id="dep-title">계좌별 입금</h2>
            <p class="hint">입금내역 기준 · 음수는 출금 또는 다른 계좌로 이체 · 막대는 선택한 기간만 표시</p>
          </div>
        </div>
        <div class="mini-kpis" id="dep-kpis"></div>
        <div class="year-grid">
          <div class="table-wrap"><table id="dep-table" class="data"></table></div>
          <div>
            <div class="legend" id="dep-legend"></div>
            <div class="chart-box mid"><canvas id="dep-chart" aria-label="월별 계좌별 입금"></canvas></div>
          </div>
        </div>
        <details id="dep-log">
          <summary id="dep-log-summary"></summary>
          <div class="table-wrap"><table id="dep-log-table" class="data"></table></div>
        </details>
      </section>

      <div class="grid-2" id="grid-2">
        <section class="card" aria-labelledby="alloc-title">
          <div class="card-head">
            <div>
              <h2 id="alloc-title">그룹별 비중</h2>
              <p class="hint" id="alloc-note"></p>
            </div>
            <div class="seg small" id="group-seg" role="group" aria-label="그룹 기준"></div>
          </div>
          <div class="group-toolbar" id="group-toolbar" hidden>
            <button type="button" class="btn primary" id="group-add">+ 새 그룹</button>
            <button type="button" class="btn" id="stock-add">+ 종목 직접 추가</button>
            <span class="hint">그룹 줄을 누르면 소속 종목을 보고 편집할 수 있습니다</span>
          </div>
          <p class="empty-state" id="alloc-empty" hidden></p>
          <div class="alloc" id="alloc-body">
            <div class="chart-box donut"><canvas id="alloc-chart" aria-label="그룹별 비중"></canvas></div>
            <div class="table-wrap"><table id="group-table" class="data"></table></div>
          </div>
          <div id="group-detail"></div>
        </section>

        <section class="card" aria-labelledby="div-title" id="div-card">
          <div class="card-head">
            <h2 id="div-title">배당</h2>
            <span class="hint">세후 입금 기준</span>
          </div>
          <div class="mini-kpis" id="div-kpis"></div>
          <div class="chart-box mid"><canvas id="div-chart" aria-label="월별 배당금"></canvas></div>
          <div class="table-wrap"><table id="div-table" class="data"></table></div>
        </section>
      </div>

      <section class="card" aria-labelledby="hold-title">
        <div class="card-head">
          <h2 id="hold-title">보유 종목</h2>
          <span class="hint" id="hold-count"></span>
        </div>
        <div class="group-toolbar" id="hold-toolbar" hidden>
          <div class="seg small" id="hold-account-seg" role="group" aria-label="계좌 선택"></div>
          <button type="button" class="btn primary" id="holding-add">+ 종목 추가</button>
          <button type="button" class="btn" id="cash-edit">현금 수정</button>
        </div>
        <p class="empty-state" id="hold-empty" hidden></p>
        <div class="table-wrap" id="hold-wrap"><table id="hold-table" class="data"></table></div>
      </section>

      <footer class="foot" id="foot"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
