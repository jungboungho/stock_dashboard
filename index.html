<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자산 대시보드</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>자산 대시보드</h1>
          <p class="sub" id="asof"></p>
        </div>
        <div class="topbar-right">
          <span class="badge" id="source-badge"></span>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="화면 테마 전환">◐</button>
        </div>
      </header>

      <nav class="filters" aria-label="계좌 선택">
        <div class="seg" id="account-seg" role="group"></div>
      </nav>

      <section class="kpis" id="kpis" aria-label="요약"></section>

      <section class="card" aria-labelledby="trend-title">
        <div class="card-head">
          <div>
            <h2 id="trend-title">자산 추이</h2>
            <p class="hint">원금 위로 칠해진 부분이 수익금입니다 (빨강 = 수익, 파랑 = 손실)</p>
          </div>
          <div class="seg small" id="return-mode" role="group" aria-label="수익률 기준">
            <button type="button" data-mode="simple">단순 수익률</button>
            <button type="button" data-mode="twr">시간가중(TWR)</button>
          </div>
        </div>

        <div class="range-row">
          <div class="seg small" id="preset-seg" role="group" aria-label="기간"></div>
          <div class="date-range">
            <input type="date" id="a-start" aria-label="기간 시작일" />
            <span>~</span>
            <input type="date" id="a-end" aria-label="기간 종료일" />
          </div>
          <label class="check"><input type="checkbox" id="compare-toggle" /> 다른 기간과 비교</label>
        </div>

        <div class="range-row compare-row" id="compare-row" hidden>
          <span class="tag tag-b">비교 기간</span>
          <div class="seg small" role="group" aria-label="비교 기간 제안">
            <button type="button" id="b-prev">직전 기간</button>
            <button type="button" id="b-lastyear">전년 동기</button>
          </div>
          <div class="date-range">
            <input type="date" id="b-start" aria-label="비교 기간 시작일" />
            <span>~</span>
            <input type="date" id="b-end" aria-label="비교 기간 종료일" />
          </div>
        </div>

        <div class="legend" id="trend-legend"></div>
        <div class="chart-stack">
          <div class="chart-box tall"><canvas id="value-chart" aria-label="평가금과 원금 추이"></canvas></div>
          <div class="chart-box short"><canvas id="return-chart" aria-label="수익률 추이"></canvas></div>
        </div>

        <div id="period-stats"></div>

        <div id="compare-panel" hidden>
          <h3>기간별 누적 수익률 (시간가중, 시작일 = 0%)</h3>
          <div class="legend" id="compare-legend"></div>
          <div class="chart-box mid"><canvas id="compare-chart" aria-label="기간 비교 수익률"></canvas></div>
        </div>
      </section>

      <div class="grid-2">
        <section class="card" aria-labelledby="alloc-title">
          <div class="card-head">
            <h2 id="alloc-title">그룹별 비중</h2>
            <div class="seg small" id="group-seg" role="group" aria-label="그룹 기준"></div>
          </div>
          <div class="alloc">
            <div class="chart-box donut"><canvas id="alloc-chart" aria-label="그룹별 비중"></canvas></div>
            <div class="table-wrap"><table id="group-table" class="data"></table></div>
          </div>
        </section>

        <section class="card" aria-labelledby="div-title">
          <div class="card-head">
            <h2 id="div-title">배당</h2>
            <span class="hint">세후 입금 기준</span>
          </div>
          <div class="mini-kpis" id="div-kpis"></div>
          <div class="chart-box mid"><canvas id="div-chart" aria-label="월별 배당금"></canvas></div>
          <div class="table-wrap"><table id="div-table" class="data"></table></div>
        </section>
      </div>

      <section class="card" aria-labelledby="hold-title">
        <div class="card-head">
          <h2 id="hold-title">보유 종목</h2>
          <span class="hint" id="hold-count"></span>
        </div>
        <div class="table-wrap"><table id="hold-table" class="data"></table></div>
      </section>

      <footer class="foot">
        가상 데이터입니다. 종목 이름만 실제이고 가격 · 거래 · 배당은 모두 임의로 생성했습니다. 투자 판단의 근거로 쓰지 마세요.
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
